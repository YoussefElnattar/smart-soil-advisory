; Smart Soil Node — sensors-only ESP32 firmware (PlatformIO)
; Build:  pio run          Flash:  pio run -t upload        Monitor:  pio device monitor
[platformio]
default_envs = esp32-s3

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    4-20ma/ModbusMaster @ ^2.0.1
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit INA219 @ ^1.2.3
    knolleary/PubSubClient @ ^2.8

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -DBOARD_ESP32S3=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-classic]
platform = espressif32
board = esp32dev
build_flags = -DBOARD_ESP32_CLASSIC=1
